<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Pack - 风格编辑器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #0f3460;
    }

    .header h1 {
      font-size: 24px;
      color: #e94560;
    }

    .back-btn {
      padding: 8px 16px;
      background: #0f3460;
      border: none;
      border-radius: 6px;
      color: #eee;
      cursor: pointer;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #16213e;
    }

    /* 风格列表 */
    .styles-section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 16px;
      color: #888;
      margin-bottom: 12px;
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .style-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .style-card:hover {
      border-color: #e94560;
      transform: translateY(-2px);
    }

    .style-card.selected {
      border-color: #e94560;
      background: #0f3460;
    }

    .style-card.preset {
      opacity: 0.8;
    }

    .style-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .style-tone {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .style-preview {
      font-size: 13px;
      color: #aaa;
      padding: 8px;
      background: #1a1a2e;
      border-radius: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .style-badge {
      display: inline-block;
      padding: 2px 6px;
      background: #e94560;
      border-radius: 4px;
      font-size: 10px;
      color: white;
      margin-bottom: 6px;
    }

    .style-badge.custom {
      background: #4CAF50;
    }

    /* 编辑器面板 */
    .editor-panel {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }

    .editor-panel.active {
      display: block;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .editor-title {
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: #e94560;
    }

    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-hint {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    /* 按钮 */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #e94560;
      color: white;
    }

    .btn-primary:hover {
      background: #ff6b6b;
    }

    .btn-secondary {
      background: #0f3460;
      color: #eee;
    }

    .btn-secondary:hover {
      background: #16213e;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 新建按钮 */
    .create-btn {
      padding: 12px 24px;
      background: #4CAF50;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .create-btn:hover {
      background: #45a049;
    }

    /* 状态提示 */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .toast.error {
      background: #dc3545;
    }

    .toast.show {
      opacity: 1;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎭 风格编辑器</h1>
      <button class="back-btn" id="backBtn">← 返回设置</button>
    </div>

    <!-- 新建按钮 -->
    <button class="create-btn" id="createBtn">+ 创建新风格</button>

    <!-- 风格列表 -->
    <div class="styles-section">
      <div class="section-title">已有风格</div>
      <div class="styles-grid" id="stylesGrid">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 编辑器面板 -->
    <div class="editor-panel" id="editorPanel">
      <div class="editor-header">
        <h2 class="editor-title" id="editorTitle">编辑风格</h2>
        <span id="styleBadge"></span>
      </div>

      <form id="styleForm">
        <div class="form-group">
          <label class="form-label">风格名称</label>
          <input type="text" class="form-input" id="styleName" placeholder="例如：tech-blogger">
          <div class="form-hint">唯一标识，用于代码调用</div>
        </div>

        <div class="form-group">
          <label class="form-label">显示名称</label>
          <input type="text" class="form-input" id="displayName" placeholder="例如：技术博主风格">
        </div>

        <div class="form-group">
          <label class="form-label">前缀（开场白）</label>
          <textarea class="form-input form-textarea" id="stylePrefix" placeholder="例如：我跟你讲，"></textarea>
          <div class="form-hint">放在用户提问前面的文字</div>
        </div>

        <div class="form-group">
          <label class="form-label">后缀（结束语）</label>
          <textarea class="form-input form-textarea" id="styleSuffix" placeholder="例如：\n\n别整那些虚的，直接说重点。"></textarea>
          <div class="form-hint">放在用户提问后面的文字</div>
        </div>

        <div class="form-group">
          <label class="form-label">风格基调</label>
          <input type="text" class="form-input" id="styleTone" placeholder="例如：直率、幽默、有态度">
        </div>

        <div class="form-group">
          <label class="form-label">关键词（逗号分隔）</label>
          <input type="text" class="form-input" id="styleKeywords" placeholder="例如：我跟你讲,这才是,别整虚的">
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="saveBtn">保存风格</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">删除风格</button>
        </div>
      </form>
    </div>

    <!-- 预览区 -->
    <div class="editor-panel" id="previewPanel">
      <div class="section-title">效果预览</div>
      <div style="padding: 15px; background: #1a1a2e; border-radius: 6px;">
        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">原始提问：</div>
        <div id="previewOriginal" style="color: #aaa;">什么是AI发展趋势</div>
        <div style="margin-top: 15px; font-size: 12px; color: #888; margin-bottom: 8px;">风格化后：</div>
        <div id="previewStyled" style="color: #eee; padding: 10px; background: #16213e; border-radius: 4px;"></div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="style-editor.js"></script>
</body>
</html>
