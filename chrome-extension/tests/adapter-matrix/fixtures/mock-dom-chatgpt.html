<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT</title>
</head>
<body>
  <!-- Chat Input: primary textarea -->
  <div id="prompt-textarea" contenteditable="true" data-placeholder="Message ChatGPT">What is the weather today?</div>

  <!-- Chat Input: fallback textarea -->
  <textarea placeholder="Message ChatGPT" style="display:none;"></textarea>

  <!-- Send Button -->
  <button data-testid="send-button" aria-label="Send prompt">
    <svg><!-- send icon --></svg>
  </button>

  <!-- Stop Button (shown during generation) -->
  <button aria-label="Stop generating" style="display:none;">
    <svg><!-- stop icon --></svg>
  </button>

  <!-- Typing Indicator -->
  <div data-testid="typing-indicator" style="display:none;">
    <span>Typing...</span>
  </div>

  <!-- Message List -->
  <div data-testid="conversation-turn" data-message-author-role="user">
    <div class="text-base">
      <div class="markdown"><p>Hello, how are you?</p></div>
    </div>
  </div>

  <div data-testid="conversation-turn" data-message-author-role="assistant">
    <div class="text-base">
      <div class="markdown"><p>I'm doing well, thank you! How can I help you today?</p></div>
    </div>
  </div>

  <div data-testid="conversation-turn" data-message-author-role="user">
    <div class="text-base">
      <div class="markdown"><p>What is the weather today?</p></div>
    </div>
  </div>
</body>
</html>
