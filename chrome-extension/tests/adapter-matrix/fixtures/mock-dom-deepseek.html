<!DOCTYPE html>
<html lang="en">

<!--
  fixture 契约：用 data-role 标注「这个元素在真实站点里扮演什么角色」，
  测试矩阵（adapter-test-runner.js）据此把**生产 adapter 的返回值**与快照对账：
    data-role="chat-input"  输入框（应为 1 个）
    data-role="send-button" 发送按钮（应为 1 个）
    data-role="message"     消息（可多个）
  改了生产选择器却没改本快照 → 矩阵立刻报红；本快照过期 → L1 探针会报漂移。
-->
<head>
  <meta charset="UTF-8">
  <title>DeepSeek</title>
</head>
<body>
  <!-- Chat Input: textarea (primary) -->
  <textarea id="chat-input" placeholder="输入消息..." data-role="chat-input">What are transformers in AI?</textarea>

  <!-- Fallback contenteditable -->
  <div contenteditable="true" style="display:none;"></div>

  <!-- Send Button -->
  <button data-testid="send-button" aria-label="发送" class="send-button" data-role="send-button">
    <svg><!-- send icon --></svg>
  </button>

  <!-- Stop Button -->
  <button aria-label="Stop generating" style="display:none;">
    <svg><!-- stop icon --></svg>
  </button>

  <!-- Typing Indicator -->
  <div class="loading-spinner" style="display:none;"></div>
  <div class="generating" style="display:none;">
    <span>生成中...</span>
  </div>

  <!-- Message List -->
  <div data-testid="conversation-turn" class="ds-chat-message" data-role="message">
    <div class="ds-assistant-message-main-content">
      <div class="markdown"><p>What is deep learning?</p></div>
    </div>
  </div>

  <div data-testid="conversation-turn" class="ds-chat-message" data-role="message">
    <div class="ds-assistant-message-main-content">
      <div class="markdown"><p>Deep learning is a subset of machine learning that uses neural networks with multiple layers.</p></div>
    </div>
  </div>

  <div class="ds-chat-message">
    <div class="ds-assistant-message-main-content">
      <div class="markdown prose"><p>What are transformers in AI?</p></div>
    </div>
  </div>

  <!-- Fallback message elements -->
  <div class="chat-message" style="display:none;">
    <div class="message-content"><p>fallback</p></div>
  </div>
</body>
</html>
