<!DOCTYPE html>
<html lang="en">

<!--
  fixture 契约：用 data-role 标注「这个元素在真实站点里扮演什么角色」，
  测试矩阵（adapter-test-runner.js）据此把**生产 adapter 的返回值**与快照对账：
    data-role="chat-input"  输入框（应为 1 个）
    data-role="send-button" 发送按钮（应为 1 个）
    data-role="message"     消息（可多个）
  改了生产选择器却没改本快照 → 矩阵立刻报红；本快照过期 → L1 探针会报漂移。
-->
<head>
  <meta charset="UTF-8">
  <title>Qianwen (千问)</title>
</head>
<body>
  <!-- Chat Input: contenteditable div -->
  <div contenteditable="true" data-role="chat-input">
    <p>帮我写一首诗</p>
  </div>

  <!-- Fallback textarea -->
  <textarea style="display:none;"></textarea>

  <!-- Send Button -->
  <button aria-label="发送消息" title="发送" class="send-btn" data-role="send-button">
    <svg><!-- send icon --></svg>
  </button>

  <!-- Typing Indicator -->
  <div class="loading" style="display:none;">
    <span>思考中...</span>
  </div>
  <div class="generating" style="display:none;"></div>

  <!-- Message List -->
  <div class="chat-message-item" data-role="message">
    <div class="message-content">
      <div class="prose"><p>你好，千问</p></div>
    </div>
  </div>

  <div class="chat-message-item" data-role="message">
    <div class="message-content">
      <div class="prose"><p>你好！我是通义千问，有什么可以帮你的？</p></div>
    </div>
  </div>

  <div class="chat-item" data-role="message">
    <div class="message-content">
      <div class="prose"><p>帮我写一首诗</p></div>
    </div>
  </div>

  <!-- Fallback response content -->
  <div class="response-content" style="display:none;">
    <div class="content"><p>fallback</p></div>
  </div>
</body>
</html>
