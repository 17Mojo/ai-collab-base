<!DOCTYPE html>
<html lang="en">

<!--
  fixture 契约：用 data-role 标注「这个元素在真实站点里扮演什么角色」，
  测试矩阵（adapter-test-runner.js）据此把**生产 adapter 的返回值**与快照对账：
    data-role="chat-input"  输入框（应为 1 个）
    data-role="send-button" 发送按钮（应为 1 个）
    data-role="message"     消息（可多个）
  改了生产选择器却没改本快照 → 矩阵立刻报红；本快照过期 → L1 探针会报漂移。

  🔧 2026-11-14 同步：生产 yiyan-adapter.js 在 2026-11-11 真机实测后把
  messageList 从 `[class*="message"]` / `[class*="response"]` / `.chat-item`
  换成 `div.answer-container` / `div.ai-entry`（旧三件套在新 UI 上恒命中
  8 个「通知中心」元素，而 answer-container 发送前为 0 ⇒ 基准跨选择器跳变
  ⇒ 明明答完还判 Response timeout 243.6s）。
  本快照据此同步：2 条标注消息为 `div.answer-container`，正文容器同步为
  `.cosd-markdown-content`。未标注的 `.chat-item` 保留为负例，守护
  「不返回标注范围之外的元素」。
-->
<head>
  <meta charset="UTF-8">
  <title>Yiyan (文心一言)</title>
</head>
<body>
  <!-- Chat Input: textarea with ci-textarea class -->
  <textarea class="ci-textarea" placeholder="请输入你的问题..." data-role="chat-input">推荐一本好书</textarea>

  <!-- Fallback textarea -->
  <textarea style="display:none;"></textarea>

  <!-- Fallback contenteditable -->
  <div contenteditable="true" style="display:none;"></div>

  <!-- Fallback textbox role -->
  <div role="textbox" style="display:none;"></div>

  <!-- Fallback input -->
  <input type="text" style="display:none;" />

  <!-- Send Button -->
  <button type="submit" aria-label="发送" class="send-btn" data-send" data-role="send-button">
    <svg><!-- send icon --></svg>
  </button>

  <!-- Typing Indicator -->
  <div class="loading" style="display:none;">
    <span>生成中...</span>
  </div>
  <div class="spinner" style="display:none;"></div>

  <!-- Message List -->
  <div class="answer-container" data-role="message">
    <div class="cosd-markdown-content">
      <div class="prose"><p>你好，文心一言</p></div>
    </div>
  </div>

  <div class="answer-container" data-role="message">
    <div class="cosd-markdown-content">
      <div class="prose"><p>你好！我是文心一言，很高兴为你服务。</p></div>
    </div>
  </div>

  <!-- 负例：新 UI 上这类元素属于通知中心/旧气泡，不在标注范围内 -->
  <div class="chat-item">
    <div class="answer-content">
      <div class="prose"><p>推荐一本好书</p></div>
    </div>
  </div>

  <!-- Fallback selectors -->
  <div class="response-item" style="display:none;">
    <div class="content"><p>fallback</p></div>
  </div>
</body>
</html>
