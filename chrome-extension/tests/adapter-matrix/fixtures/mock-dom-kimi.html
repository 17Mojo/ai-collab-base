<!DOCTYPE html>
<html lang="en">

<!--
  fixture 契约：用 data-role 标注「这个元素在真实站点里扮演什么角色」，
  测试矩阵（adapter-test-runner.js）据此把**生产 adapter 的返回值**与快照对账：
    data-role="chat-input"  输入框（应为 1 个）
    data-role="send-button" 发送按钮（应为 1 个）
    data-role="message"     消息（可多个）
  改了生产选择器却没改本快照 → 矩阵立刻报红；本快照过期 → L1 探针会报漂移。

  🔧 2026-11-14 同步：生产 kimi-adapter.js 在 2026-11-11 真机实测后把 messageList
  从 `.chat-message` / `[class*="message"]` 换成
  `.chat-content-item-assistant` / `.chat-content-item`（旧选择器在已登录会话里
  0 命中或命中非气泡元素 ⇒ countGrew 恒 false ⇒ Response timeout）。
  本快照据此同步：标注的 3 条消息统一为 assistant 条目（生产只收 AI 回复，
  不收 human 气泡），正文容器同步为 `.markdown-container`。
  旧的 `.message-item` 保留为「标注范围之外」的负例，守护不退回宽松兜底。
-->
<head>
  <meta charset="UTF-8">
  <title>Kimi AI</title>
</head>
<body>
  <!-- Chat Input: Lexical editor -->
  <div class="chat-input-editor" contenteditable="true" role="textbox" data-role="chat-input">
    <p>What is quantum computing?</p>
  </div>

  <!-- Fallback contenteditable -->
  <div contenteditable="true" style="display:none;"></div>

  <!-- Fallback textarea -->
  <textarea style="display:none;"></textarea>

  <!-- Send Button -->
  <button type="submit" aria-label="发送消息" class="send-btn" data-role="send-button">
    <svg><!-- send icon --></svg>
  </button>

  <!-- Loading / Typing Indicator -->
  <div class="loading" style="display:none;">
    <span>思考中...</span>
  </div>

  <!-- Message List -->
  <div class="chat-content-item-assistant" data-role="message">
    <div class="markdown-container"><div class="prose"><p>你好，你是谁？</p></div></div>
  </div>

  <div class="chat-content-item-assistant" data-role="message">
    <div class="markdown-container"><div class="prose"><p>我是 Kimi，一个 AI 助手。有什么可以帮你的？</p></div></div>
  </div>

  <div class="chat-content-item-assistant" data-role="message">
    <div class="markdown-container"><div class="prose"><p>什么是量子计算？</p></div></div>
  </div>

  <!-- 负例：标注范围之外的元素，不属于任何生产选择器（守护「不回退到全部 div」） -->
  <div class="message-item" style="display:none;">
    <div class="content"><p>fallback message</p></div>
  </div>
</body>
</html>
