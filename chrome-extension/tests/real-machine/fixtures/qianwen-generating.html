<!--
  千问「生成中」DOM 契约（**从站点自己的产物推导**）

  对应 qianwen-conversation.html 的同一个会话，处于**流式输出中**的状态。
  依据同样是站点自己的代码（@ali/qianwen-web/4.11.5）：

    - 站点渲染代码里，`tq` 组件渲染 `className: \`answer-common-card ${t}\``，
      正文由 `tL`（MarkdownText）渲染 `className:"answer-text md-text-card"`；
    - 「停止回答」按钮与「发送消息」按钮占**输入区的同一个位置**
      （`H ? <停止回答> : <发送消息>`），生成中前者替换后者。
      i18n key = qianwenWeb.input.stopAnswer，站点词典实测值「停止回答」。

  这份 fixture 要守住的性质：

    - 生成中**答案卡已经存在**（正文只写了一半）——消息计数因此会 +1，
      所以 isTyping() 必须同时为 true，否则 waitForResponse 会在
      回复还没写完时就提前返回；
    - 「停止回答」按钮是**唯一**的生成中信号（接收中的点点点卡片此时已卸载），
      所以它必须被 typingIndicator 认出来。
-->
<div class="chat-room-outer-wrap">
  <div class="chat-container-wrapper">
    <div class="message-list-container scroll-container message-list-scroll-container h-full mini-chat-scroller">
      <div class="message-list-content-container">

        <div data-chat-list-key="chat-1">
          <div class="chat-round" data-chat="chat-1" data-chat-pos="0">
            <div class="chat-question-wrap">
              <div class="chat-question-card-wrap" data-chat-question-wrap="q-1">
                <div class="message-card-wrap question" data-mt="text/plain">
                  <div class="question-text-card">北京今天天气怎么样？</div>
                </div>
              </div>
            </div>
            <div class="chat-answers-card-wrap" data-chat-answers-wrap="a-1">
              <div class="answer-common-card undefined" data-mt="custom/markdown">
                <div class="answer-text md-text-card">
                  <div class="qk-markdown qk-markdown-react qk-markdown-code-light">
                    <p><span class="qk-md-text">北京今天晴，气温 18 到 27 摄氏度。</span></p>
                    <p><span class="qk-md-text">出门建议带一件薄外套。</span></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div data-chat-list-key="chat-2">
          <div class="chat-round" data-chat="chat-2" data-chat-pos="1">
            <div class="chat-question-wrap">
              <div class="chat-question-card-wrap" data-chat-question-wrap="q-2">
                <div class="message-card-wrap question" data-mt="text/plain">
                  <div class="question-text-card">那明天呢？</div>
                </div>
              </div>
            </div>
            <div class="chat-answers-card-wrap" data-chat-answers-wrap="a-2">
              <!-- 正文只写了一半：第一段到了，第二段还没到 -->
              <div class="answer-common-card undefined" data-mt="custom/markdown">
                <div class="answer-text md-text-card">
                  <div class="qk-markdown qk-markdown-react qk-markdown-code-light">
                    <p><span class="qk-md-text">明天多云，气温 16 到 25 摄氏度。</span></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="homeInputContainer-anIFXS inputContainer-Bv9w0f">
  <div class="relative min-h-[24px] w-full whitespace-pre-wrap break-words text-left"
       data-placeholder="向千问提问"
       data-not-record-snapshot="true"
       data-slate-editor="true"

       contenteditable="true"
       data-probe-role="chat-input"

    <p data-slate-node="element"><span data-slate-node="text"></span></p>
  </div>
  <!-- 生成中：这个位置上是「停止回答」，「发送消息」按钮此时不存在 -->
  <button type="button"
          aria-label="停止回答"
          data-probe-role="stop-button"
          class="inline-flex size-8 shrink-0 items-center justify-center rounded-full border-0 p-0">

  </button>
</div>
