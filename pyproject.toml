[project]
name = "ai-collab-system"
version = "2.0.0"
description = "AI 协作开发系统 - Claude Code + GitHub Copilot 协作框架"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AI Collab Team"},
]
keywords = ["ai", "collaboration", "vscode", "claude", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ai-collab = "ai_collab.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["wheel", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# 收集范围限定 tests/：hermes_target/ 是外部 Hermes 移植目标的本地副本，
# 其 hermes_agent 模块不在本仓库依赖内，收集会触发 ModuleNotFoundError
# (2026-09-26 已知陷阱)。tests/ 之外无测试文件，CI 口径为 tests/unit/，
# 本地 testpaths 覆盖面 >= CI。
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "asyncio: mark test as async",
    "slow: mark test as slow",
    "integration: mark test as integration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# 排除结构性限制的入口/集成模块 (单测投入产出比低)
# 这些应由 E2E 测试覆盖, 不是单元测试的责任
# 见 CLAUDE.md「经验 3」: CLI 入口/编排层适合显式 omit, 不靠凑覆盖率数字掩盖
#
# 注意: ai_collab/cli/react_convert.py 已于 2026-10-22 移出本列表 ——
# 它原先被 omit 掩盖了「0% 覆盖 + 未接入主 CLI」的真实缺口。
# 现已补 tests/unit/cli/test_react_convert_cli.py 并接入 `pack convert` 子命令。
omit = [
    "ai_collab/__main__.py",
    "ai_collab/cli/__main__.py",
    "ai_collab/cli/_cli_main.py",
]

[tool.coverage.report]
# 只显示非 100% 的文件, 让体检报告更清爽
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "except ImportError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式收紧, 避免一次性大面积 fail

# 字段错配防御 (来自 2026-09-15 教训: context/search.py 3 处属性错配)
warn_unused_ignores = true
warn_redundant_casts = true
warn_attribute_access = true  # 关键: 抓属性访问错误

# 测试目录允许更宽松（测试代码优先可读）
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 选集说明:
# E/W = pycodestyle 错误/警告
# F = pyflakes
# I = isort
# B = bugbear
# UP = pyupgrade
# N = pep8-naming
select = ["E", "F", "W", "I", "B", "UP", "N"]
# E402 module level import not at top
# E501 line too long
# F402 import shadowed by loop variable
# F821 undefined name
# B008 function call in default argument
ignore = ["E402", "E501", "F402", "F821", "B008"]

# 项目范围内的低优先级警告豁免
# B904 raise from - 已有 logging 错误处理
# E722 bare except - 业务异常处理需要
# N802/N803/N806 命名约定 - 本地代码惯例
# B017 assert Exception - pytest.raises 使用
# E741 变量名 l - 测试代码
extend-ignore = ["B904", "E722", "F811", "N802", "N803", "N806", "N817", "E741", "B017"]
