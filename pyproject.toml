[project]
name = "ai-collab-system"
version = "2.0.0"
description = "AI 协作开发系统 - Claude Code + GitHub Copilot 协作框架"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AI Collab Team"},
]
keywords = ["ai", "collaboration", "vscode", "claude", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ai-collab = "ai_collab.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["wheel", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式收紧, 避免一次性大面积 fail

# 字段错配防御 (来自 2026-09-15 教训: context/search.py 3 处属性错配)
warn_unused_ignores = true
warn_redundant_casts = true
warn_attribute_access = true  # 关键: 抓属性访问错误

# 测试目录允许更宽松（测试代码优先可读）
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 选集说明:
# E/W = pycodestyle 错误/警告
# F = pyflakes
# I = isort
# B = bugbear
# UP = pyupgrade
# N = pep8-naming
select = ["E", "F", "W", "I", "B", "UP", "N"]
# E402 module level import not at top
# E501 line too long
# F402 import shadowed by loop variable
# F821 undefined name
# B008 function call in default argument
ignore = ["E402", "E501", "F402", "F821", "B008"]

# 项目范围内的低优先级警告豁免
# B904 raise from - 已有 logging 错误处理
# E722 bare except - 业务异常处理需要
# N802/N803/N806 命名约定 - 本地代码惯例
# B017 assert Exception - pytest.raises 使用
# E741 变量名 l - 测试代码
extend-ignore = ["B904", "E722", "F811", "N802", "N803", "N806", "N817", "E741", "B017"]
