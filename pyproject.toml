[project]
name = "ai-collab-system"
version = "2.0.0"
description = "AI 协作开发系统 - Claude Code + GitHub Copilot 协作框架"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AI Collab Team"},
]
keywords = ["ai", "collaboration", "vscode", "claude", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ai-collab = "ai_collab.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["wheel", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式收紧, 避免一次性大面积 fail

# 字段错配防御 (来自 2026-09-15 教训: context/search.py 3 处属性错配)
warn_unused_ignores = true
warn_redundant_casts = true
warn_attribute_access = true  # 关键: 抓属性访问错误

# 测试目录允许更宽松（测试代码优先可读）
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 选集说明:
# E/W = pycodestyle 错误/警告
# F   = pyflakes (未使用导入、未定义变量等)
# I   = isort (导入排序)
# B   = bugbear (常见 bug 模式, 包括 B009 字段访问检测)
# UP  = pyupgrade (现代化语法)
# N   = pep8-naming (命名约定)
select = ["E", "F", "W", "I", "B", "UP", "N"]
# E402: module level import not at top (测试 fixtures 需要)
# E501: line too long (长字符串注释常见)
# F402: import 'X' shadowed by loop variable (dataclass 字段常见)
# F821: undefined name (动态属性场景)
# B008: function call in default argument (pytest fixtures)
ignore = ["E402", "E501", "F402", "F821", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"local-backend/**" = ["E", "F"]
"products/**" = ["E", "F"]
"collaboration/scripts/**" = ["E", "F"]
"monitor.py" = ["E722"]
"release-*/**" = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "asyncio: mark test as async",
    "slow: mark test as slow",
    "integration: mark test as integration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# 排除结构性限制的入口/集成模块 (单测投入产出比低)
# 这些应由 E2E 测试覆盖, 不是单元测试的责任
omit = [
    "ai_collab/__main__.py",
    "ai_collab/cli/__main__.py",
    "ai_collab/cli/_cli_main.py",
    "ai_collab/cli/react_convert.py",
]

[tool.coverage.report]
# 只显示非 100% 的文件, 让体检报告更清爽
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "except ImportError",
]
