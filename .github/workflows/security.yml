name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 跑一次（夜间扫描依赖漏洞）
    - cron: "0 4 * * 1"

jobs:
  # 静态代码安全扫描（Bandit）
  bandit:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        run: |
          # 跑全量扫描，JSON 留底供下载
          bandit -r ai_collab/ -f json -o bandit-report.json || true

      - name: Evaluate severity
        run: |
          python - <<'PY'
          import json, sys, os
          if not os.path.exists("bandit-report.json"):
              print("::error::Bandit did not produce a report")
              sys.exit(1)
          data = json.load(open("bandit-report.json"))
          counts = {"HIGH": 0, "MEDIUM": 0, "LOW": 0}
          for r in data.get("results", []):
              sev = r.get("issue_severity", "")
              counts[sev] = counts.get(sev, 0) + 1
          print(f"::notice::Bandit summary: HIGH={counts['HIGH']} MEDIUM={counts['MEDIUM']} LOW={counts['LOW']}")

          # 当前策略：HIGH > 0 警告（不阻塞），等修复完再切严格
          if counts["HIGH"] > 0:
              print(f"::warning title=Bandit High issues found::{counts['HIGH']} High severity issues detected. See artifacts for details.")
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  # 依赖漏洞扫描（pip-audit，替代已弃用的 safety）
  pip-audit:
    name: pip-audit Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # 当前策略：发现漏洞只警告，不阻塞
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
            pip-audit -r requirements.txt || echo "::warning::Vulnerable dependencies detected, see report"
          else
            echo "::notice::No requirements.txt found, skipping"
          fi

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
