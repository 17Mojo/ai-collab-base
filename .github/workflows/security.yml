name: Security Scan

# 🔧 2026-11-14 Node 24 第二组：官方 actions/* 升到 v7（试点 PR #49 已验收）。
# 本 workflow 步骤内无 git 操作、不读 checkout 凭据、普通 pull_request 事件 ⇒
# checkout v7 的 fork PR 限制（仅 pull_request_target / workflow_run）不命中；
# setup-python v7.0.0 移除 pip-install input 与 EOL Python，本 workflow 只用
# python-version: "3.12" ⇒ 均不命中。
# upload-artifact v7 默认仍打包 zip（新增可选的 archive:false 直传单文件）、
# 原有 inputs 不变，且本 workflow 不下载 artifact。
# 详见 build.yml 头部的分组依据。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 跑一次（夜间扫描依赖漏洞）
    - cron: "0 4 * * 1"

jobs:
  # 静态代码安全扫描（Bandit）
  bandit:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        # 2026-11-15 清吞错：摘掉 `|| true`。bandit 1.9.4（与 CI 同版本）实测退出码：
        #   exit 0 = 无 findings，或**空扫描**（路径不存在时也返回 0，报告带 errors）
        #   exit 1 = 有 findings（生产日志 HIGH=0 MEDIUM=1 LOW=42，报告照常写出）
        #   exit 2 = 参数/执行错误（报告可能是 0 字节非法 JSON）
        # exit 1 是设计内的「只警告」结果，交下一步按 severity 裁决；
        # exit >= 2 是工具没跑起来，必须挡 CI。原 `|| true` 把三者一起吞了。
        run: |
          set +e
          bandit -r ai_collab/ -f json -o bandit-report.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ge 2 ]; then
            echo "::error::bandit 执行失败 (exit $EXIT_CODE)，扫描结果不可信。"
            exit 1
          fi
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::notice::bandit 报告了 findings (exit 1)，交由 Evaluate severity 按级别裁决。"
          fi

      - name: Evaluate severity
        # 2026-11-15 补空扫描兜底：bandit 对不存在的路径返回 0 且照样写报告，
        # 报告里 `errors` 非空、metrics 只有 `_totals`；只查「文件存在」会让
        # 「ai_collab/ 被改名 / 扫描链路断了」静默输出全 0 并全绿。
        run: |
          python - <<'PY'
          import json, sys, os
          if not os.path.exists("bandit-report.json"):
              print("::error::Bandit did not produce a report")
              sys.exit(1)
          try:
              data = json.load(open("bandit-report.json"))
          except (ValueError, OSError) as e:
              print(f"::error::Bandit report is not valid JSON: {e}")
              sys.exit(1)
          errors = data.get("errors", [])
          if errors:
              print(f"::error::Bandit reported {len(errors)} execution error(s): {errors[:3]}")
              sys.exit(1)
          metrics = data.get("metrics", {})
          scanned = [k for k in metrics if k != "_totals"]
          if not scanned:
              print("::error::Bandit scanned 0 files; the scan path may be missing.")
              sys.exit(1)
          print(f"::notice::Bandit scanned {len(scanned)} files")
          counts = {"HIGH": 0, "MEDIUM": 0, "LOW": 0}
          for r in data.get("results", []):
              sev = r.get("issue_severity", "")
              counts[sev] = counts.get(sev, 0) + 1
          print(f"::notice::Bandit summary: HIGH={counts['HIGH']} MEDIUM={counts['MEDIUM']} LOW={counts['LOW']}")

          # 当前策略：HIGH > 0 警告（不阻塞），等修复完再切严格
          if counts["HIGH"] > 0:
              print(f"::warning title=Bandit High issues found::{counts['HIGH']} High severity issues detected. See artifacts for details.")
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  # 依赖漏洞扫描（pip-audit，替代已弃用的 safety）
  pip-audit:
    name: pip-audit Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # 2026-11-15 清吞错：发现漏洞即真失败。此前是三重吞错——step 级
        # continue-on-error 加两条 pip-audit 各自的 || true / || echo，
        # 只摘开关等于没清（本地对照：漏洞场景下脚本仍 exit 0）。
        # 依赖清单缺失也不再静默 skip：扫描根本没跑就该挡 CI，而不是绿。
        # pip-audit 源码 _cli.py 实证：漏洞路径先写 --output 报告再 sys.exit(1)，
        # 故下面 Upload 的 if: always() 能拿到报告；_fatal() 类致命错误不产出
        # 报告，upload-artifact 只会给 warning，不会二次失败。
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt 不存在，依赖漏洞扫描无法执行。"
            exit 1
          fi
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          pip-audit -r requirements.txt

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
