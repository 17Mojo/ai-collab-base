name: Security Scan

# 🔧 2026-11-14 Node 24 第二组：官方 actions/* 升到 v7（试点 PR #49 已验收）。
# 本 workflow 步骤内无 git 操作、不读 checkout 凭据、普通 pull_request 事件 ⇒
# checkout v7 的 fork PR 限制（仅 pull_request_target / workflow_run）不命中；
# setup-python v7.0.0 移除 pip-install input 与 EOL Python，本 workflow 只用
# python-version: "3.12" ⇒ 均不命中。
# upload-artifact v7 默认仍打包 zip（新增可选的 archive:false 直传单文件）、
# 原有 inputs 不变，且本 workflow 不下载 artifact。
# 详见 build.yml 头部的分组依据。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 跑一次（夜间扫描依赖漏洞）
    - cron: "0 4 * * 1"

jobs:
  # 静态代码安全扫描（Bandit）
  bandit:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        # 2026-11-15 双报告：完整报告留档 + baseline 对比报告供门禁。
        # bandit 1.9.4 退出码：0=无 findings（或空扫描）/ 1=有 findings /
        # 2=参数或执行错误。`-b` 模式下 1 表示「有 baseline 之外的新增」，
        # 由下一步打印明细后挡 CI；这里只挡 >= 2 的工具崩溃。
        # 两次都写报告，保证完整 findings 仍可在 artifact 里查看。
        # 注：这里只挡「文件 0 字节」；`results: []` 是合法空基线
        #（存量全部收敛后），由 Evaluate severity 的 _audit 校验兜底。
        run: |
          if [ ! -s .github/bandit-baseline.json ]; then
            echo "::error::bandit baseline 文件缺失或为 0 字节，门禁无法判定新增。"
            exit 1
          fi
          set +e
          bandit -r ai_collab/ -f json -o bandit-report.json
          FULL_EXIT=$?
          bandit -b .github/bandit-baseline.json -r ai_collab/ -f json -o bandit-new.json
          GATE_EXIT=$?
          set -e
          if [ "$FULL_EXIT" -ge 2 ] || [ "$GATE_EXIT" -ge 2 ]; then
            echo "::error::bandit 执行失败 (full=$FULL_EXIT gate=$GATE_EXIT)，扫描结果不可信。"
            exit 1
          fi
          echo "::notice::bandit exit: full=$FULL_EXIT baseline-gated=$GATE_EXIT"

      - name: Evaluate severity
        # 2026-11-15 门禁三层 + 强制审计：
        #   1) baseline 必须带 _audit（理由 / commit / bandit 版本 /
        #      result_count / results_sha256），且 append-only 审计日志
        #      .github/bandit-baseline-audit.jsonl 末条与之匹配。
        #      手工编辑 baseline 会破坏摘要校验；重生成唯一入口是
        #      scripts/regenerate_bandit_baseline.py --reason "<理由>"。
        #   2) bandit 原生 -b 报新增即挡（逐条打印明细）。
        #   3) 逐组 (fname, test_id, issue_text, severity) 计数比较，覆盖
        #      「同构新增」与「修 A 组 1 条 + 新增 B 组 1 条」跨组替换。
        # 空 baseline 合法（存量全部收敛后），但 _audit 与审计日志仍强制存在。
        # 完整报告每轮仍生成并上传，存量 findings 不是隐藏。
        # 空扫描兜底沿用 PR #63：errors 非空 / 扫描 0 文件 / 非法 JSON 全挡。
        run: |
          python - <<'PY'
          import json, sys, os, hashlib, collections, re

          BASELINE = ".github/bandit-baseline.json"
          AUDIT_LOG = ".github/bandit-baseline-audit.jsonl"

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def load(path):
              if not os.path.exists(path):
                  fail(f"{path} 不存在，扫描链路可能已断。")
              try:
                  return json.load(open(path))
              except (ValueError, OSError) as e:
                  fail(f"{path} 不是合法 JSON: {e}")

          def digest(rows):
              payload = json.dumps(rows, sort_keys=True, ensure_ascii=False, separators=(",", ":"))
              return hashlib.sha256(payload.encode("utf-8")).hexdigest()

          def groups(rows):
              c = collections.Counter()
              for r in rows:
                  key = (r.get("filename", ""), r.get("test_id", ""),
                         r.get("issue_text", ""), r.get("issue_severity", ""))
                  c[key] += 1
              return c

          full = load("bandit-report.json")
          if full.get("errors"):
              fail(f"Bandit reported {len(full['errors'])} execution error(s): {full['errors'][:3]}")
          scanned = [k for k in full.get("metrics", {}) if k != "_totals"]
          if not scanned:
              fail("Bandit scanned 0 files; the scan path may be missing.")
          counts = {"HIGH": 0, "MEDIUM": 0, "LOW": 0}
          for r in full.get("results", []):
              sev = r.get("issue_severity", "")
              counts[sev] = counts.get(sev, 0) + 1
          print(f"::notice::Bandit full report: scanned {len(scanned)} files / "
                f"{len(full.get('results', []))} findings "
                f"(HIGH={counts['HIGH']} MEDIUM={counts['MEDIUM']} LOW={counts['LOW']})")

          # --- 1) baseline 强制审计 ---
          baseline = load(BASELINE)
          audit = baseline.get("_audit")
          if not isinstance(audit, dict):
              fail("baseline 缺 _audit 元数据块；请通过 scripts/regenerate_bandit_baseline.py --reason 重生成。")
          required = ("schema_version", "generated_at", "generated_from_commit",
                      "bandit_version", "scan_path", "result_count",
                      "results_sha256", "reason")
          missing = [k for k in required if audit.get(k) in (None, "")]
          if missing:
              fail(f"baseline _audit 缺字段: {missing}")
          rows = baseline.get("results")
          if not isinstance(rows, list):
              fail("baseline results 必须是列表。")
          if audit["result_count"] != len(rows):
              fail(f"baseline _audit.result_count={audit['result_count']} 与实际 {len(rows)} 不符。")
          dig = digest(rows)
          if audit["results_sha256"] != dig:
              fail("baseline results 与 _audit.results_sha256 不一致——手工改动被拒；请用重生成脚本。")
          if len(str(audit["reason"]).strip()) < 10:
              fail("baseline _audit.reason 太短，必须写明「为什么允许这批 findings」。")
          if not re.fullmatch(r"[0-9a-f]{7,40}|unknown", str(audit["generated_from_commit"])):
              fail("baseline _audit.generated_from_commit 不是有效 commit sha。")

          if not os.path.exists(AUDIT_LOG):
              fail(f"缺少 append-only 审计日志 {AUDIT_LOG}；baseline 变更必须留痕。")
          last = None
          for line in open(AUDIT_LOG, encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              try:
                  last = json.loads(line)
              except ValueError:
                  fail("审计日志含非法 JSON 行。")
          if not isinstance(last, dict):
              fail("审计日志为空，无法证明 baseline 经过合法重生成。")
          if (last.get("results_sha256") != dig
                  or last.get("reason") != audit["reason"]
                  or last.get("result_count") != len(rows)):
              fail("审计日志末条与 baseline _audit 不一致——baseline 变更未登记，请跑重生成脚本。")
          print(f"::notice::Bandit baseline audit: {len(rows)} findings | "
                f"commit={str(audit['generated_from_commit'])[:8]} | reason={str(audit['reason'])[:60]}")
          print(f"::notice::Bandit baseline: {len(rows)} known findings")

          # --- 2) HIGH 硬挡（不因进过 baseline 而豁免） ---
          if counts["HIGH"] > 0:
              fail(f"{counts['HIGH']} High severity Bandit issues detected.")

          # --- 3) 原生 -b 新增 ---
          gated = load("bandit-new.json")
          if gated.get("errors"):
              fail(f"Bandit baseline-gated scan reported errors: {gated['errors'][:3]}")
          new = gated.get("results", [])
          if new:
              for r in new[:10]:
                  print(f"::error::New finding: {r.get('filename')}:{r.get('line_number')} "
                        f"{r.get('test_id')} ({r.get('issue_severity')}) {r.get('issue_text')}")
              fail(f"{len(new)} new Bandit finding(s) not in baseline. "
                   f"Fix them, or regenerate the baseline with an explicit justification.")

          # --- 4) 逐组计数闸门 ---
          # bandit 原生 -b 的 Issue.__eq__ 只比七元组（不含 lineno/code），
          # 同文件新增同构 finding 会命中已有七元组被当成已知。逐组计数
          # 同时覆盖「同构新增」与「修 A 组 1 条 + 新增 B 组 1 条」跨组替换。
          cur, base = groups(full.get("results", [])), groups(rows)
          excess = [(k, n, base.get(k, 0)) for k, n in cur.items() if n > base.get(k, 0)]
          print(f"::notice::Bandit group counts: current={sum(cur.values())} "
                f"baseline={sum(base.values())} groups={len(cur)}")
          if excess:
              for k, n, b in excess[:10]:
                  print(f"::error::Group grew: {k[0]}:{k[1]} ({k[3]}) +{n - b} — {str(k[2])[:80]}")
              fail(f"{len(excess)} 组 findings 超过 baseline（同构新增或跨组替换）。"
                   f"请修复，或带显式理由重生成 baseline。")

          print("::notice::Bandit gate: 0 new findings - PASS")
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          # 完整报告（全量 findings）+ baseline 门禁报告（新增 findings）+
          # append-only 审计日志，便于追查每次 baseline 重生成的理由与 commit。
          path: |
            bandit-report.json
            bandit-new.json
            .github/bandit-baseline-audit.jsonl
          retention-days: 14

  # 依赖漏洞扫描（pip-audit，替代已弃用的 safety）
  pip-audit:
    name: pip-audit Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # 2026-11-15 清吞错：发现漏洞即真失败。此前是三重吞错——step 级
        # continue-on-error 加两条 pip-audit 各自的 || true / || echo，
        # 只摘开关等于没清（本地对照：漏洞场景下脚本仍 exit 0）。
        # 依赖清单缺失也不再静默 skip：扫描根本没跑就该挡 CI，而不是绿。
        # pip-audit 源码 _cli.py 实证：漏洞路径先写 --output 报告再 sys.exit(1)，
        # 故下面 Upload 的 if: always() 能拿到报告；_fatal() 类致命错误不产出
        # 报告，upload-artifact 只会给 warning，不会二次失败。
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt 不存在，依赖漏洞扫描无法执行。"
            exit 1
          fi
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          pip-audit -r requirements.txt

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
