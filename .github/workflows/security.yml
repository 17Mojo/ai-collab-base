name: Security Scan

# 🔧 2026-11-14 Node 24 第二组：官方 actions/* 升到 v7（试点 PR #49 已验收）。
# 本 workflow 步骤内无 git 操作、不读 checkout 凭据、普通 pull_request 事件 ⇒
# checkout v7 的 fork PR 限制（仅 pull_request_target / workflow_run）不命中；
# setup-python v7.0.0 移除 pip-install input 与 EOL Python，本 workflow 只用
# python-version: "3.12" ⇒ 均不命中。
# upload-artifact v7 默认仍打包 zip（新增可选的 archive:false 直传单文件）、
# 原有 inputs 不变，且本 workflow 不下载 artifact。
# 详见 build.yml 头部的分组依据。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 跑一次（夜间扫描依赖漏洞）
    - cron: "0 4 * * 1"

jobs:
  # 静态代码安全扫描（Bandit）
  bandit:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        # 2026-11-15 双报告：完整报告留档 + baseline 对比报告供门禁。
        # bandit 1.9.4 退出码：0=无 findings（或空扫描）/ 1=有 findings /
        # 2=参数或执行错误。`-b` 模式下 1 表示「有 baseline 之外的新增」，
        # 由下一步打印明细后挡 CI；这里只挡 >= 2 的工具崩溃。
        # 两次都写报告，保证完整 findings 仍可在 artifact 里查看。
        run: |
          if [ ! -s .github/bandit-baseline.json ]; then
            echo "::error::bandit baseline 缺失或为空，门禁无法判定新增。"
            exit 1
          fi
          set +e
          bandit -r ai_collab/ -f json -o bandit-report.json
          FULL_EXIT=$?
          bandit -b .github/bandit-baseline.json -r ai_collab/ -f json -o bandit-new.json
          GATE_EXIT=$?
          set -e
          if [ "$FULL_EXIT" -ge 2 ] || [ "$GATE_EXIT" -ge 2 ]; then
            echo "::error::bandit 执行失败 (full=$FULL_EXIT gate=$GATE_EXIT)，扫描结果不可信。"
            exit 1
          fi
          echo "::notice::bandit exit: full=$FULL_EXIT baseline-gated=$GATE_EXIT"

      - name: Evaluate severity
        # 2026-11-15 升门禁：baseline 之外的新增 findings 真挡 PR。
        # 存量 43 条（LOW=42 / MEDIUM=1）登记在 .github/bandit-baseline.json，
        # 是可审计的已知问题快照，**不是隐藏**：完整报告每轮仍生成并上传。
        # 不改 21 个文件的业务语义——B404/B603/B607 共 25 条是 subprocess
        # 保守提醒，B110/B112 共 17 条是静默吞异常，唯一 MEDIUM（B113）
        # 经核查为误报：laya_client.py:114 的 requests.get 已带
        # timeout=min(2.0, self.timeout)。逐条收敛后需重新生成 baseline。
        # 空扫描兜底沿用 PR #63：errors 非空 / 扫描 0 文件 / 非法 JSON 全挡。
        run: |
          python - <<'PY'
          import json, sys, os

          def load(path):
              if not os.path.exists(path):
                  print(f"::error::{path} 不存在，扫描链路可能已断。")
                  sys.exit(1)
              try:
                  return json.load(open(path))
              except (ValueError, OSError) as e:
                  print(f"::error::{path} 不是合法 JSON: {e}")
                  sys.exit(1)

          full = load("bandit-report.json")
          if full.get("errors"):
              print(f"::error::Bandit reported {len(full['errors'])} execution error(s): {full['errors'][:3]}")
              sys.exit(1)
          scanned = [k for k in full.get("metrics", {}) if k != "_totals"]
          if not scanned:
              print("::error::Bandit scanned 0 files; the scan path may be missing.")
              sys.exit(1)
          counts = {"HIGH": 0, "MEDIUM": 0, "LOW": 0}
          for r in full.get("results", []):
              sev = r.get("issue_severity", "")
              counts[sev] = counts.get(sev, 0) + 1
          print(f"::notice::Bandit full report: scanned {len(scanned)} files / "
                f"{len(full.get('results', []))} findings "
                f"(HIGH={counts['HIGH']} MEDIUM={counts['MEDIUM']} LOW={counts['LOW']})")

          baseline = load(".github/bandit-baseline.json")
          if not baseline.get("results"):
              print("::error::bandit baseline 里没有任何条目，可能被误清空。")
              sys.exit(1)
          print(f"::notice::Bandit baseline: {len(baseline['results'])} known findings")

          # HIGH 不因进过 baseline 而豁免；当前 baseline 内 HIGH=0。
          if counts["HIGH"] > 0:
              print(f"::error::{counts['HIGH']} High severity Bandit issues detected.")
              sys.exit(1)

          gated = load("bandit-new.json")
          if gated.get("errors"):
              print(f"::error::Bandit baseline-gated scan reported errors: {gated['errors'][:3]}")
              sys.exit(1)
          new = gated.get("results", [])
          if new:
              for r in new[:10]:
                  print(f"::error::New finding: {r.get('filename')}:{r.get('line_number')} "
                        f"{r.get('test_id')} ({r.get('issue_severity')}) {r.get('issue_text')}")
              print(f"::error::{len(new)} new Bandit finding(s) not in baseline. "
                    f"Fix them, or regenerate the baseline with an explicit justification.")
              sys.exit(1)
          print("::notice::Bandit gate: 0 new findings - PASS")
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          # 完整报告（43 条全量可见）+ baseline 门禁报告（新增 findings）。
          path: |
            bandit-report.json
            bandit-new.json
          retention-days: 14

  # 依赖漏洞扫描（pip-audit，替代已弃用的 safety）
  pip-audit:
    name: pip-audit Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # 2026-11-15 清吞错：发现漏洞即真失败。此前是三重吞错——step 级
        # continue-on-error 加两条 pip-audit 各自的 || true / || echo，
        # 只摘开关等于没清（本地对照：漏洞场景下脚本仍 exit 0）。
        # 依赖清单缺失也不再静默 skip：扫描根本没跑就该挡 CI，而不是绿。
        # pip-audit 源码 _cli.py 实证：漏洞路径先写 --output 报告再 sys.exit(1)，
        # 故下面 Upload 的 if: always() 能拿到报告；_fatal() 类致命错误不产出
        # 报告，upload-artifact 只会给 warning，不会二次失败。
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt 不存在，依赖漏洞扫描无法执行。"
            exit 1
          fi
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          pip-audit -r requirements.txt

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
