name: Project Health Check

# 🔧 2026-11-14 Node 24 单点试点（只在**本 workflow** 生效，验收前不推全库）
#
# 背景：CI annotations 报 checkout@v4 / setup-python@v5 仍声明 Node.js 20，
# runner 强制把它们迁到 Node 24。官方 v7 的 action.yml 均为 `using: node24`。
# 本 workflow 只做「checkout → setup-python → 跑体检脚本 → 传 artifact」，
# 不涉及 git push / persist-credentials / pull_request_target，是最小面试点。
#
# 本轮**故意不动**：
#   - upload-artifact@v4 / download-artifact@v4：必须成对升级，且跨 job 下载
#     只在 pull_request 事件触发，workflow_dispatch 验不到，留作下一组；
#   - sticky-pull-request-comment@v2：第三方 action，单独评估；
#   - runs-on: ubuntu-latest：Ubuntu 26 迁移是 runner 侧通知，不是配置错误。
# 验收通过后再讨论是否把这两处版本推广到其余 6 个 workflow。

on:
  schedule:
    # 每周一 06:00 UTC 跑一次
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ai_collab/**"
      - "tests/**"
      - "scripts/project_healthcheck.py"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage mypy ruff
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run healthcheck
        run: |
          python scripts/project_healthcheck.py > health_output.md
          cat health_output.md

      - name: Parse score
        id: parse
        run: |
          # 从报告里提取总分
          SCORE=$(grep -oP "总分: \K[0-9]+" health_output.md | head -1)
          GRADE=$(grep -oP "总分: [0-9]+/100 \(\K[A-D][+]?" health_output.md | head -1)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "grade=$GRADE" >> $GITHUB_OUTPUT

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: health_output.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: project-health
          message: |
            ## Project Health Report

            Score: **${{ steps.parse.outputs.score }}/100** (${{ steps.parse.outputs.grade }})

            See the workflow run for full details and the artifact for the complete report.

  fail-on-low-score:
    # 分数低于 60 报警, 但不阻塞 PR (留作信息)
    needs: health
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download health report
        uses: actions/download-artifact@v4
        with:
          name: health-report-${{ github.run_id }}

      - name: Check score
        run: |
          SCORE=$(grep -oP "总分: \K[0-9]+" health_output.md | head -1)
          if [ -z "$SCORE" ]; then
            echo "::warning::未能从报告中解析出总分，跳过阈值检查。"
            exit 0
          fi
          if [ "$SCORE" -lt 60 ]; then
            echo "::warning::Project health score dropped to $SCORE. Please review."
          fi
