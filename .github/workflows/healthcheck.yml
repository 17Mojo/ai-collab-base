name: Project Health Check

# 🔧 2026-11-14 Node 24 分组升级 · 第四组：artifact 成对升级
#
# 前情：PR #49 在本 workflow 单点试点 checkout@v4→v7 / setup-python@v5→v7
# 并验收通过；PR #50 / #51 已把官方 actions 推广到 build / security /
# lint / mypy-gate。本组把当时「故意不动」的两处 artifact action 成对升完。
#
# 为什么必须成对：upload-artifact@v7 与 download-artifact@v8 均转 ESM +
# Node 24（runner ≥ 2.327.1）。v7 默认 archive: true 仍打包 zip，
# v8 默认 skip-decompress: false、检查 Content-Type 后解压 ⇒ 两者自洽，
# health_output.md 落到 GITHUB_WORKSPACE，下游 grep 读得到。
# v8 另新增：digest-mismatch 默认 error、direct downloads（为配合 v7 可选的
# archive:false 直传单文件）；本 workflow 未启用直传，走原有 zip 路径。
# name 用 health-report-<github.run_id>，download 侧 run-id 默认当前
# github.run_id，跨 job 由 needs: health 保证顺序，无需 github-token。
#
# 同时把本文件加入 pull_request.paths：此前只改 workflow 自身**不会触发**
# 本 workflow 的 PR 事件，而 fail-on-low-score 的下载步骤带
# `if: github.event_name == 'pull_request'` ⇒ workflow_dispatch / schedule
# 下必然 skipped，跨 job 下载链路根本没被 PR 验证过（PR #49 试点时正是
# 靠 workflow_dispatch，下载 job 按设计 skipped）。加入自身后本 PR 可自验；
# 写法与 mypy-gate.yml 的 paths 对齐（那个文件一直包含自身）。
#
# 🔧 2026-11-14 Node 24 第三方第二组：sticky-pull-request-comment v2→v3。
# 上游 action.yml 原文核对：v3 的 runs.using 为 "node24"（v2 是 node20）；
# 本 workflow 用的 header / message 两个 input 均保留，GITHUB_TOKEN 默认仍是
# ${{ github.token }}。v3.0.0 换 Node 24，v3.0.1 把构建从 ncc 换成 rollup
# 并把上游自家 CI 改用 pull_request trigger —— 后者不是使用者的触发约束；
# 本 workflow 本就是 pull_request 事件，且该 step 带
# `if: github.event_name == 'pull_request'`，语义不变。
# PR #53 的 run 43598745440 已证 v2 的 "Comment on PR" 在仓库默认
# GITHUB_TOKEN 权限下 success ⇒ 权限前提不变，本轮不额外加 permissions：
# 若加就必须同时给 contents: read，否则第 51 行的 actions/checkout
# 会因权限收紧反而失败。
#
# 本轮仍**故意不动**（Task #16 两处，另开单）：
#   - runs-on: ubuntu-latest：Ubuntu 26 迁移是 runner 侧通知，不是配置错误；
#   - pip install -r requirements.txt 2>/dev/null || true：与 PR #52 清掉的
#     mypy-gate 同型吞错，不混入 action 版本升级；
#   - Check score 里 SCORE 为空时静默 exit 0：文件缺失/格式变更会被吞成假绿。

on:
  schedule:
    # 每周一 06:00 UTC 跑一次
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ai_collab/**"
      - "tests/**"
      - "scripts/project_healthcheck.py"
      # 2026-11-14：改 workflow 自身也要触发自己，否则 PR 事件下才执行的
      # fail-on-low-score（跨 job artifact 下载）永远验不到。对齐 mypy-gate.yml。
      - ".github/workflows/healthcheck.yml"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage mypy ruff
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run healthcheck
        run: |
          python scripts/project_healthcheck.py > health_output.md
          cat health_output.md

      - name: Parse score
        id: parse
        run: |
          # 从报告里提取总分
          SCORE=$(grep -oP "总分: \K[0-9]+" health_output.md | head -1)
          GRADE=$(grep -oP "总分: [0-9]+/100 \(\K[A-D][+]?" health_output.md | head -1)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "grade=$GRADE" >> $GITHUB_OUTPUT

      - name: Upload report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: health-report-${{ github.run_id }}
          path: health_output.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: project-health
          message: |
            ## Project Health Report

            Score: **${{ steps.parse.outputs.score }}/100** (${{ steps.parse.outputs.grade }})

            See the workflow run for full details and the artifact for the complete report.

  fail-on-low-score:
    # 分数低于 60 报警, 但不阻塞 PR (留作信息)
    needs: health
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download health report
        uses: actions/download-artifact@v8
        with:
          name: health-report-${{ github.run_id }}

      - name: Check score
        run: |
          SCORE=$(grep -oP "总分: \K[0-9]+" health_output.md | head -1)
          if [ -z "$SCORE" ]; then
            echo "::warning::未能从报告中解析出总分，跳过阈值检查。"
            exit 0
          fi
          if [ "$SCORE" -lt 60 ]; then
            echo "::warning::Project health score dropped to $SCORE. Please review."
          fi
