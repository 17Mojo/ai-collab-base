name: Nightly Build

on:
  schedule:
    # 每天 UTC 02:00（避开工作时间，跑全量慢测）
    - cron: "0 2 * * *"
  workflow_dispatch:  # 允许手工跑

jobs:
  nightly-tests:
    name: Full Test Suite (Nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e . 2>/dev/null || true

      - name: Run full test suite with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=ai_collab --cov-report=html --cov-report=xml \
            --durations=20 \
            2>&1 | tee nightly-test.log

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-html
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-log
          path: nightly-test.log
          retention-days: 7

      # 如果 nightly 失败，发邮件/通知（可选）
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Nightly tests failed::Nightly test suite failed. Check artifacts for details."
