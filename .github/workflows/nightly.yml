name: Nightly Build

# 🔧 2026-11-14 Node 24 第五组 A（nightly）：官方 actions/* 升到 v7。
# 前四组已逐条核对并生产验证官方 v7/v8 的 breaking changes：
# PR #49 healthcheck 试点、#50 build+security、#51 lint+mypy-gate、
# #53 healthcheck artifact 成对（upload@v7 + download@v8）。本组与第五组 B
# （test.yml）是最后两批 checkout / setup-python / upload-artifact。
#
# 本 workflow 的特点与核查：
#   - 只有 schedule + workflow_dispatch，**PR 不触发** ⇒ 必须手跑分支验证；
#   - 4 处 upload-artifact 都带 if: always()，且**全无下载方**（全仓唯一
#     download-artifact@v8 在 healthcheck.yml，用的是各自的 github.run_id）
#     ⇒ 升 v7 不触及下载链路；v7 默认 archive: true、原有 inputs 不变；
#   - `set -o pipefail`（PR #48 修掉 tee 吞 pytest 退出码）保持不动，
#     本 PR 不改任何 run 脚本；
#   - 只用 python-version: "3.12"，setup-python v7 移除 pip-install input、
#     调整 EOL 测试矩阵均不命中；checkout v7 的 fork PR 限制不命中
#     （无 pull_request 事件、步骤内无 git 操作、不读 checkout 凭据）。
# 按 PR #52 的全仓分类，`pip install -e . 2>/dev/null || true` 属
# 「可选可编辑安装」，另案裁定，不混入 action 版本升级。

on:
  schedule:
    # 每天 UTC 02:00（避开工作时间，跑全量慢测）
    - cron: "0 2 * * *"
  workflow_dispatch:  # 允许手工跑

jobs:
  nightly-tests:
    name: Full Test Suite (Nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e . 2>/dev/null || true

      - name: Run full test suite with coverage
        # 2026-11-14：这条命令走管道。未指定 shell 时 GitHub 在 Linux 上默认用
        # `bash -e {0}`（**不带 pipefail**）⇒ pytest 失败会被 tee 的 0 退出码吞掉，
        # nightly 显示全绿而实际测试红了。显式开 pipefail，让左端失败真的挡住 step。
        # 本地复现：bash -e -c 'false | tee /dev/null' → 0；加 -o pipefail → 1。
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short \
            --cov=ai_collab --cov-report=html --cov-report=xml \
            --durations=20 \
            2>&1 | tee nightly-test.log

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-html
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-log
          path: nightly-test.log
          retention-days: 7

      # 项目事实快照：CI 环境跑出的「机器视角真证」（目录树/行数/CLI 入口/测试收集数）
      # 与仓库内 docs/FACTS.generated.md（开发者手动刷新的基线）互为校验，
      # 差异即文档漂移信号。不自动提交回仓库——CI 写仓库会引入归属不清
      # （PROTOCOL.md 14.4），人工刷新保持单一责任人。
      - name: Generate project facts snapshot
        if: always()
        run: |
          bash scripts/gen_facts.sh
          cp docs/FACTS.generated.md nightly-facts-snapshot.md

      - name: Upload facts snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-facts-snapshot
          path: nightly-facts-snapshot.md
          retention-days: 30

      # 如果 nightly 失败，发邮件/通知（可选）
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Nightly tests failed::Nightly test suite failed. Check artifacts for details."
