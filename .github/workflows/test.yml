name: Test Suite

# 🔧 2026-11-14 Node 24 第五组 B（test.yml）：官方 actions/* 升到 v7。
# 这是本系列最后一批官方 action。前四组 + 第五组 A 已逐条核对并生产验证
# 所有 breaking changes：PR #49（healthcheck 试点）、#50（build+security）、
# #51（lint+mypy-gate）、#53（healthcheck artifact 成对 v7/v8）、
# #54（nightly，且拿到全 workflow 零 Node 20 告警）。
#
# 本 workflow 面最大（6 job、12 处），但类型都已在前组验证过：
#   - checkout@v7：PR #50 / #51 已验。本 workflow 是普通 push / pull_request /
#     workflow_dispatch，步骤内无 git 操作、不读 checkout 凭据 ⇒ fork PR 限制
#     （仅 pull_request_target / workflow_run）不命中。
#   - setup-python@v7：矩阵 3.10 / 3.11 / 3.12。PR #51 已由生产日志证实
#     setup-python@v7 在 Ubuntu 26 runner 上装成 CPython 3.10.22
#     （python-3.10.22-linux-26.04-x64.tar.gz），且 cache: pip 正常；
#     「Remove EOL Python versions」只动上游自家 CI 测试矩阵，运行时不拒绝
#     EOL 版本。本 workflow 显式禁用 cache pip，v7 移除的是 pip-install input。
#   - setup-node@v7：PR #50 的 build.yml 已验 node-version: "20" 正常；
#     ESM 迁移、移除 dummy NODE_AUTH_TOKEN、新增 cache outputs 均不命中
#     （本 workflow 只用 node-version，不发布 npm）。
#   - 本 workflow 无 upload/download-artifact ⇒ 不涉及 artifact 链路。
# 🔧 2026-11-14 Node 24 第三方第三组（最后一组）：codecov v4→v7。
# 上游 action.yml 原文（v7 tag 与 v7.1.1 同一 commit 303a32d）：
#   - v7 的 runs.using = composite，不再是 node20 JS action；主体是
#     dist/codecov.sh 下载 Codecov CLI（依赖 bash/git/curl/gpg），唯一 JS
#     step 是 pinned actions/github-script@ed597411…（= v8.0.0，node24）。
#   - `file` input 在 **v5.0.0 就被 deprecated 并移除**（Migration Guide
#     明确 file → files、plugin → plugins），v7 只留 `files`；本 workflow
#     的 file: ./coverage.xml 必须改成 files: ./coverage.xml。单元素列表
#     与原单文件语义等价（v7 描述为「追加到搜索到的报告」）。
#   - fail_ci_if_error 默认 false，与显式值一致；token 无 default、
#     use_oidc 默认 false ⇒ 不调 getIDToken，不需要 id-token: write；
#     skip_validation 默认 false 需 gpg，runner 具备（run 43603021708 的
#     v4 日志已实证 gpg 导入与 SHA256SUM 校验可用）。
#   - v6.0.0 起支持 node24；v7.0.0 只是 GPG 签名账户 codecovsecurity →
#     codecovsecops 的迁移，非功能 breaking。
# 注意（既有假绿，非本轮引入，另案 Task #21）：run 43603021708 里 codecov
# v4 的 step conclusion=success，但 CLI 日志三阶段全部报
# "Token required - not valid tokenless upload" —— 无 CODECOV_TOKEN 且
# protected branch，上传实际失败，被 fail_ci_if_error: false 吞成绿。
# 本轮只做版本与 input 迁移，不改变该行为，也不假装修好了上传。
# 本地 composite ./.github/actions/coverage-gate 仍不动。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # 禁用 cache pip：避免使用陈旧的缓存依赖
          # requirements.txt 已包含完整依赖列表（aiohttp, pydantic 等）

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 使用完整 requirements.txt（包含 aiohttp、sqlalchemy、pydantic 等）
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Lint (ruff)
        # 只检查主源码目录。src/ 已于 6030087 删除——此前把 src/ 写在这里，
        # 目录缺失会使 ruff 退出码非零，进而触发 `|| ruff check .` 回退到全仓
        # 检查，把 tests/ 里的历史遗留错误也算进来，导致本步骤
        # 失败并遮蔽后续的覆盖率门禁。
        run: |
          pip install ruff
          ruff check ai_collab/ scripts/

      - name: Type check (mypy, informational)
        # mypy 已清零（Success: no issues found in 99 source files），
        # 阻塞式门禁见 mypy-gate.yml。此处保留为信息性输出，
        # continue-on-error 暂留以防上游 mypy 版本升级引入新告警。
        continue-on-error: true
        run: |
          pip install mypy
          mypy ai_collab/ 2>&1 | tail -10

      - name: Run unit tests with coverage
        run: |
          pip install pytest-cov coverage
          python -m pytest tests/unit/ -v --tb=short \
            --cov=ai_collab --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage gate (>=85 percent)
        # 阈值与测量方法的唯一事实源在 .github/actions/coverage-gate/action.yml
        # mypy-gate.yml 调用同一个 action，两者口径完全一致，不会互相掩盖。
        # 调整阈值只改 action.yml 一处。
        uses: ./.github/actions/coverage-gate

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # Codecov 不可用时不阻塞 CI

      - name: Run integration tests
        # 2026-11-09 起为阻塞门禁（摘掉 continue-on-error）。
        # 摘之前先补了真因：fastapi 未锁版本 → CI 解析到 starlette 1.x →
        # TestClient 需要 httpx2，而 httpx2 不在依赖里 → test_api.py 收集即失败。
        # 于是「集成测试红了」被 continue-on-error 吞成一个绿 step，持续多轮无人知晓。
        # 补 httpx2 后本地实测 124 passed / 6 skipped，才敢把门拧上。
        run: |
          python -m pytest tests/integration/ -v --tb=short

  extension-static-checks:
    # tests/e2e/ 是 chrome-extension 的静态结构守护（读文件 + 断言，不起服务、不依赖
    # python 版本），此前只挂在 nightly.yml 里跑全量 ⇒ PR 阶段完全看不见。
    # 代价已经付过一次：pack-storage-manager.js 在 5c4eabc 删除后，4 条断言在 main
    # 上红了 6 天（2026-11-03 → 11-09）才被人工发现。
    # 单次 job、不进 3.10/3.11/3.12 矩阵：静态检查跑三遍只烧时间，不增信息。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Run e2e static checks
        run: |
          python -m pytest tests/e2e/ -v --tb=short

  performance-tests:
    # 复核发现 #2：tests/perf/ 此前不在 PR 门禁内，这类性能回归在 PR 阶段不可见。
    # 纳入门禁的前提是「测量口径本身是确定的」——2026-10-24 已把性能用例的
    # HOME 隔离掉（tests/perf/conftest.py），基线不再依赖运行者的机器历史。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Run performance baseline
        # 墙钟阈值在共享 runner 上有机器速度噪声（最紧的 cli_help 阈值 1.0s，
        # 本机冷启动实测 0.29~0.32s），故给 2 次重试。
        # 重试不是掩盖回归：测量口径的确定性由 tests/unit/test_perf_isolation_guard.py
        # 钉住（隔离后与运行者的机器历史解耦，倍率约 90 倍）。
        run: |
          for attempt in 1 2 3; do
            if python -m pytest tests/perf/ -v --tb=short; then
              echo "✅ 性能基线通过（第 $attempt 次尝试）"
              exit 0
            fi
            echo "⚠️ 性能基线第 $attempt 次未通过，重试中…"
            sleep 5
          done
          echo "❌ 性能基线连续 3 次未通过"
          exit 1

  chrome-extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        # 不再用 `npm ci 2>/dev/null || npm install` 兜底：锁文件已入库
        # （chrome-extension/package-lock.json），`npm ci` 失败就是真失败。
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1：矩阵只需要 jsdom，
        # 不需要浏览器二进制（真机探针不在 CI 里跑，见 docs/REAL_MACHINE_REGRESSION.md）。
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          cd chrome-extension
          npm ci

      - name: Run adapter matrix (production adapter vs real-DOM snapshot)
        # 这一步**不再允许失败被吞掉**。此前写的是
        #   node tests/test-adapters.js 2>/dev/null || echo "adapter tests skipped"
        # 而那两个文件早已归档到 tests/_archive/，命令必然失败 → 必然走 echo 分支 →
        # CI 长期绿灯，实际**一个扩展测试都没跑**。
        # 现在跑的是 adapter-matrix：它 import 生产 adapter 源码（src/platforms/*.js），
        # 用 fixture 里 data-role 标注的真实 DOM 快照对账，生产选择器漂移会真的报红。
        run: |
          cd chrome-extension
          node tests/adapter-matrix/adapter-test-runner.js

      - name: Run extension unit tests (node:test)
        # 单测走自建入口 tests/run-tests.mjs，不用 `node --test` 自动发现：
        # 自动发现会扫进 tests/playwright/node_modules 里的第三方测试，本机实测直接卡死；
        # 目录形式在 Node 23 上报 MODULE_NOT_FOUND；glob 形式要 Node 21+ 而 CI 钉的是 20。
        # 入口自己枚举文件、显式传路径，Node 18+ 都能跑，本地与 CI 用同一条命令。
        run: |
          cd chrome-extension
          node tests/run-tests.mjs

      - name: Mutation check (prove the tests actually guard the defects)
        # 一套全绿的测试**什么都不能证明**，除非能证明「改坏被守护的那处代码，
        # 对应测试会变红」。这个步骤把「守护关系」本身变成可执行的断言：
        # 每条变异对应一个具体缺陷，要求**指定的那条测试**因此报错。
        # 变异在临时副本上进行，不动工作区。
        run: |
          cd chrome-extension
          node tests/real-machine/mutation-check.mjs

      - name: Build extension bundle
        # 矩阵绿不代表能构建：把 vite 构建也纳入门禁，防止 adapter 改动把产物打坏。
        run: |
          cd chrome-extension
          npm run build

  pack-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Validate Pack JSONs
        # 两个目录都要能解析：examples 是可运行包，templates 是结构参考。
        # 注意这里只查 JSON 语法——「能不能跑」由 tests/integration/test_pack_validation.py
        # 的 test_examples_all_valid 守（走 validate_pack），别把那个删了只留这个。
        run: |
          for pack in packs/examples/*.json packs/templates/*.json; do
            python -c "import json; json.load(open('$pack'))" && echo "✅ $pack"
          done

  studio-api-integration:
    # N12 收口：Studio 端点测试对真后端（prompt-pack-api）真跑，不再静默 skip。
    # 独立 job 且**不带** continue-on-error——generate/download 链路断了必须挡 PR。
    # 端口用 8123（8000 常被开发机上的其他服务占用），
    # 测试侧以 STUDIO_TEST_BASE_URL 指过来（tests/integration/test_studio_integration.py）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r local-backend/requirements.txt
          pip install pytest

      - name: Start local backend on 8123
        # 后端 import ai_collab（pack.schema_validator），故 PYTHONPATH 指仓库根；
        # uvicorn 需在 local-backend/ 下启动（模块路径 app.main:app）。
        run: |
          cd local-backend
          PYTHONPATH="$GITHUB_WORKSPACE" nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8123 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/health | grep -q prompt-pack-api; then
              echo "✅ backend up"
              exit 0
            fi
            sleep 1
          done
          echo "❌ backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run Studio integration tests against real backend
        env:
          STUDIO_TEST_BASE_URL: http://127.0.0.1:8123
        run: |
          python -m pytest tests/integration/test_studio_integration.py -v --tb=short
