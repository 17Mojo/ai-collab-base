name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 禁用 cache pip：避免使用陈旧的缓存依赖
          # requirements.txt 已包含完整依赖列表（aiohttp, pydantic 等）

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 使用完整 requirements.txt（包含 aiohttp、sqlalchemy、pydantic 等）
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ai_collab/ src/ scripts/ 2>/dev/null || ruff check .

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --timeout=60

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short --timeout=120 || true

  chrome-extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run adapter tests
        run: |
          cd chrome-extension
          npm ci 2>/dev/null || npm install
          node tests/test-adapters.js 2>/dev/null || echo "adapter tests skipped"
          node tests/test-branch-executor.js 2>/dev/null || echo "branch tests skipped"

  pack-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Pack JSONs
        run: |
          for pack in packs/examples/*.json; do
            python -c "import json; json.load(open('$pack'))" && echo "✅ $pack"
          done
