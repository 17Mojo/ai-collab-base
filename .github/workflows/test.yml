name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 禁用 cache pip：避免使用陈旧的缓存依赖
          # requirements.txt 已包含完整依赖列表（aiohttp, pydantic 等）

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 使用完整 requirements.txt（包含 aiohttp、sqlalchemy、pydantic 等）
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || true

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ai_collab/ src/ scripts/ 2>/dev/null || ruff check .

      - name: Type check (mypy, informational)
        # 当前 113 errors, 不阻塞 CI (渐进式收紧, 与 test.yml 约定一致)
        # 规则: 新代码不应引入 NEW 类型错误 (warn_unused_ignores 已启用)
        # 目标: 0 errors 后移除 continue-on-error
        continue-on-error: true
        run: |
          pip install mypy
          mypy ai_collab/ 2>&1 | tail -10

      - name: Run unit tests with coverage
        run: |
          pip install pytest-cov coverage
          python -m pytest tests/unit/ -v --tb=short \
            --cov=ai_collab --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage gate (≥80%)
        # 防退化: 当前 TOTAL 80% (commit 7d2cc9d 之后), 不达标则 fail
        # 关键模块已 78-94%, 80% 是底线; 调整时同步更新 CLAUDE.md
        run: |
          coverage report --fail-under=80 || (echo "::error::Coverage below 80% threshold"; exit 1)

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # Codecov 不可用时不阻塞 CI

      - name: Run integration tests
        # 已删除 || true：让集成测试失败真正报警
        # 风险：当前 integration 测试若有问题会立刻显形，需要先跑一遍确认
        run: |
          python -m pytest tests/integration/ -v --tb=short
        continue-on-error: true  # 临时保留，避免新发现的失败阻塞其他 job

  chrome-extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run adapter tests
        run: |
          cd chrome-extension
          npm ci 2>/dev/null || npm install
          node tests/test-adapters.js 2>/dev/null || echo "adapter tests skipped"
          node tests/test-branch-executor.js 2>/dev/null || echo "branch tests skipped"

  pack-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Pack JSONs
        run: |
          for pack in packs/examples/*.json; do
            python -c "import json; json.load(open('$pack'))" && echo "✅ $pack"
          done
