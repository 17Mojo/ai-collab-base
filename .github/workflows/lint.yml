name: Code Quality

# 🔧 2026-11-14 Node 24 第三组（lint + mypy-gate）：官方 actions/* 升到 v7。
# 依据：PR #49 单点试点、PR #50 第二组（build + security）均已验收通过。
# setup-python v7 release note 的「Remove EOL Python versions」经核查只动上游自家
# CI 测试矩阵与 fixture（actions/setup-python#1333 的改动文件全是 .github/workflows/
# 与 __tests__/data/），运行时并不拒绝 EOL 版本；生产 versions-manifest.json 中
# 3.10.22 明确含 linux 26.04 构建 ⇒ 本文件 3 个 job 的 python-version: "3.10"
# 在 Ubuntu 26 runner 上仍可用。v7 action.yml 仍保留 cache / cache-hit，
# lint job 的 cache: pip 不受影响；v7 移除的 pip-install input 本文件未使用。
# checkout v7 的 fork PR 限制只针对 pull_request_target / workflow_run，
# 本文件是普通 push / pull_request 且步骤内无 git 操作 ⇒ 不命中。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check . || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Scan for secrets and PII
        # 阻断级门禁：扫描器退出码非 0 即失败。
        # 2026-10-24 起解除 `|| true` —— 此前扫描器 251 条命中全是误报
        # （node_modules 压缩产物 + 源码标识符），门禁形同虚设；
        # 扫描器改造后本仓实测 0 命中、退出码 0，门禁才真正生效。
        # 误报豁免走 config/secrets-scan-allowlist.txt（按 <文件>:<行号> 精确豁免）。
        run: |
          python scripts/scan_secrets_pii.py --workspace .

  dependency-hygiene:
    # 阻断级门禁：node_modules 不得进版本库，但锁文件必须在。
    # 两者是同一条不变量的一体两面——只做前者，会把「依赖版本不确定」
    # 这个真问题用「仓库小了」这个假象掩盖过去。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Check node_modules is untracked (and lockfiles are present)
        run: |
          python scripts/check_node_modules_untracked.py
