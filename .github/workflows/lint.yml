name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check . || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Scan for secrets and PII
        # 阻断级门禁：扫描器退出码非 0 即失败。
        # 2026-10-24 起解除 `|| true` —— 此前扫描器 251 条命中全是误报
        # （node_modules 压缩产物 + 源码标识符），门禁形同虚设；
        # 扫描器改造后本仓实测 0 命中、退出码 0，门禁才真正生效。
        # 误报豁免走 config/secrets-scan-allowlist.txt（按 <文件>:<行号> 精确豁免）。
        run: |
          python scripts/scan_secrets_pii.py --workspace .

  dependency-hygiene:
    # 阻断级门禁：node_modules 不得进版本库，但锁文件必须在。
    # 两者是同一条不变量的一体两面——只做前者，会把「依赖版本不确定」
    # 这个真问题用「仓库小了」这个假象掩盖过去。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check node_modules is untracked (and lockfiles are present)
        run: |
          python scripts/check_node_modules_untracked.py
