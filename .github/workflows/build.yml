name: Build Artifacts

# 🔧 2026-11-14 Node 24 第二组（build + security）：官方 actions/* 升到 v7。
# 试点 PR #49 已验收「checkout / setup-python v7 在最小面 workflow 上安全」。
# 本组两个 workflow 步骤内均无 git push、不读 checkout 凭据、无 pull_request_target ⇒
# checkout v6 的 persist-credentials 改存单独文件、v7 的 fork PR 限制都不命中。
# setup-node v7 转 ESM、移除 dummy NODE_AUTH_TOKEN、新增 cache outputs；本 workflow
# 只用 node-version、不发布 npm ⇒ 行为变化不命中。
# upload-artifact v7 转 ESM 并新增可选 archive:false 直传单文件，默认仍打包 zip，
# name / path / if-no-files-found / retention-days inputs 不变；GitHub-hosted runner
# 满足 v6 起要求的 >= 2.327.1。全仓唯一 download-artifact 在 healthcheck.yml，
# 且没有跨 workflow 下载 ⇒ 本组升级不会破坏任何下载链路。
# 🔧 2026-11-14 Node 24 第三方第一组（build.yml）：docker pair 成对升级。
# 官方 actions/* 已在 PR #49~#55 全部收官（v7 / download v8），剩余 Node 20
# 告警只来自 4 个第三方 action，逐个按上游 action.yml 原文事实核查后分组落地。
# 本组成对升 setup-buildx-action v3→v4、build-push-action v5→v7：
#   - 两者 runs.using 均由 node20 改为 node24，要求 runner >= 2.327.1；
#     官方 v7 系列已在 PR #49~#55 于同一批 GitHub-hosted runner 上生产验证过，
#     前提成立。
#   - setup-buildx v4 的 "Remove deprecated inputs/outputs" 不命中：本 workflow
#     无 with、不读 outputs；v4 仍保留 version / driver / cache-binary / cleanup
#     等 inputs 与 name / driver / platforms / nodes outputs。
#   - build-push v7 的 breaking changes 不命中：本 workflow 只用的
#     context / tags / push / load 四个 input 在 v7 action.yml 中全部保留
#     （push / load 默认仍 'false'）；移除的是 DOCKER_BUILD_NO_SUMMARY、
#     DOCKER_BUILD_EXPORT_RETENTION_DAYS 两个 env 与 legacy export-build 工具，
#     本 workflow 未设置、未依赖 build summary。
#   - build-push 上的 continue-on-error: true 当时按「不混入版本升级」留到
#     另案；已于本轮 Task #20 清掉，见下方 Build backend image 注释。
# 本 workflow 只有 push / workflow_dispatch，无 pull_request 触发 ⇒
# 用 workflow_dispatch 手跑 build-docker job 验证，不看 PR checks。
#
# 🔧 2026-11-14 清吞错（Task #20）：摘掉 Build backend image 的
# continue-on-error: true。此前镜像构建失败会被吞成绿 job，且本 workflow
# 无 pull_request 触发，PR checks 根本看不到这个 job。
# 前置核查：最近 6 次 build.yml run（含 main push 与 workflow_dispatch）的
# build-docker job 全部 success；PR #56 的 run 43605560522 日志实证
# "#12 exporting to oci image format DONE" + ImageID，镜像真构建并 load
# ⇒ 摘掉兜底不引入新失败。此后 Dockerfile / 依赖拉不动就真红。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build Chrome Extension
        # 2026-11-14 清吞错：此前 npm ci 失败会静默降级到 npm install，
        # npm run build 失败被 2>/dev/null 吞掉后还打印不实的
        # "no build script; using source" —— package.json 实际有
        # "build": "node build.js"。GitHub 默认 shell 是 bash -e {0}，
        # 裸命令失败即挡住 step；npm ci --dry-run 已验证 lockfile 一致。
        # 口径与 test.yml 的 Install dependencies 一致（那里已注明
        # 「npm ci 失败就是真失败」，并清理过 adapter tests skipped 的历史假绿）。
        run: |
          cd chrome-extension
          npm ci
          npm run build
          mkdir -p dist
          echo "Extension build placeholder" > dist/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: chrome-extension/dist/
          if-no-files-found: warn

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        # 2026-11-14 清吞错：去掉 continue-on-error，镜像构建失败真挡 CI。
        # 口径同 PR #52 的 npm ci / npm run build；最近 6 次 run 该 job 全绿，
        # 生产日志有 exporting to oci image format DONE + ImageID 实证。
        uses: docker/build-push-action@v7
        with:
          context: ./local-backend
          tags: ai-collab-backend:latest
          push: false
          load: true
