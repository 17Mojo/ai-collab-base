name: Mypy Type Check Gate

# 🔧 2026-11-14 Node 24 第三组：官方 actions/* 升到 v7（PR #49 / #50 已验收）。
# 只用 python-version: "3.12"，setup-python v7 移除 pip-install input、调整 EOL
# 测试矩阵均不命中；checkout v7 的 fork PR 限制不命中（普通 PR 事件、步骤内无
# git 操作、不读 checkout 凭据）。
# upload-artifact v7 默认仍打包 zip（archive: true）、原有 inputs 不变，
# artifact name 里的 github.run_id 表达式不受影响；本 workflow 不下载 artifact，
# 全仓唯一 download-artifact 在 healthcheck.yml 且无跨 workflow 下载 ⇒ 链路安全。
# 本地 composite action ./.github/actions/coverage-gate 非外部版本，不动。
# 分组依据与 breaking-change 逐条核对另见 build.yml / security.yml 头部注释。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "ai_collab/**"
      - "tests/**"
      - ".github/workflows/mypy-gate.yml"

jobs:
  mypy:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy ruff pytest pytest-cov
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run mypy strict type check
        run: |
          python -m mypy ai_collab/ > mypy_output.txt 2>&1
          EXIT_CODE=$?
          echo "mypy output:"
          cat mypy_output.txt
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::mypy found type errors. See mypy_output.txt for details."
            exit 1
          fi
          echo "mypy: 0 errors - PASS"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report-${{ github.run_id }}
          path: mypy_output.txt
          retention-days: 30

  coverage-gate:
    name: Coverage Gate (>=85%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mypy
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest tests/unit --cov=ai_collab --cov-report=term --cov-report=xml -q

      - name: Check coverage threshold
        # 阈值与测量方法的唯一事实源在 .github/actions/coverage-gate/action.yml
        # 与 test.yml 共用同一 action，口径完全一致（此前这里用 XML line-rate + 阈值 80，
        # 与 test.yml 的 coverage report + 阈值 85 互不知情，宽松的一套会掩盖严格的一套）。
        uses: ./.github/actions/coverage-gate
