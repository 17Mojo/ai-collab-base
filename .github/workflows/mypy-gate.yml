name: Mypy Type Check Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "ai_collab/**"
      - "tests/**"
      - ".github/workflows/mypy-gate.yml"

jobs:
  mypy:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy ruff pytest pytest-cov
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run mypy strict type check
        run: |
          python -m mypy ai_collab/ > mypy_output.txt 2>&1
          EXIT_CODE=$?
          echo "mypy output:"
          cat mypy_output.txt
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::mypy found type errors. See mypy_output.txt for details."
            exit 1
          fi
          echo "mypy: 0 errors - PASS"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report-${{ github.run_id }}
          path: mypy_output.txt
          retention-days: 30

  coverage-gate:
    name: Coverage Gate (>=80%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mypy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest tests/unit --cov=ai_collab --cov-report=term --cov-report=xml -q

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('coverage.xml').getroot(); print(int(float(root.attrib.get('line-rate', 0)) * 100))")
          echo "Current coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "::error::Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% - PASS"
